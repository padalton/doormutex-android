name: Release

# Push a tag like v0.4.0 (matching versionName in app/build.gradle.kts).
# Builds the AAB for Google Play and an APK for the GitHub release, both
# signed with the upload key from the repository secrets:
#   DOORMUTEX_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   DOORMUTEX_KEYSTORE_PASSWORD
#   DOORMUTEX_KEY_ALIAS
#   DOORMUTEX_KEY_PASSWORD
# With Play App Signing, Google re-signs what it distributes, so the GitHub
# APK and the Play app have different signatures: switching between them
# needs an uninstall.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Version matches the tag
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          test "v$name" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versionName $name"; exit 1; }
          echo "VERSION=$name" >> "$GITHUB_ENV"

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOORMUTEX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "secret DOORMUTEX_KEYSTORE_BASE64 missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "DOORMUTEX_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Check, test, build
        env:
          DOORMUTEX_KEYSTORE_PASSWORD: ${{ secrets.DOORMUTEX_KEYSTORE_PASSWORD }}
          DOORMUTEX_KEY_ALIAS: ${{ secrets.DOORMUTEX_KEY_ALIAS }}
          DOORMUTEX_KEY_PASSWORD: ${{ secrets.DOORMUTEX_KEY_PASSWORD }}
        run: ./gradlew --console=plain ktlintCheck lintDebug testDebugUnitTest bundleRelease assembleRelease

      - name: Name the files
        run: |
          mkdir dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/doormutex-$VERSION.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/doormutex-$VERSION.apk"
          (cd dist && sha256sum * > SHA256SUMS)
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: AAB for Google Play
        uses: actions/upload-artifact@v7
        with:
          name: doormutex-${{ env.VERSION }}-aab
          path: dist/*.aab

      - name: GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=fastlane/metadata/android/en-US/changelogs/$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts).txt
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --title "doormutex $VERSION" --notes-file "$notes" --prerelease
