name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Licences · REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  build:
    name: Lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: ktlint, Android lint, unit tests, release build (unsigned)
        run: ./gradlew --console=plain ktlintCheck lintDebug testDebugUnitTest assembleRelease
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-unsigned
          path: app/build/outputs/apk/release/*.apk
